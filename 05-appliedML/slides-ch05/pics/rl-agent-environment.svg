<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="rl-title rl-desc">
  <title id="rl-title">Reinforcement learning: agent and environment</title>
  <desc id="rl-desc">An agent chooses an action and sends it to the environment. The environment responds with a new observation, or state information, and a reward. The agent uses this feedback to choose its next action.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#012169"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#012169">
    <rect x="75" y="65" width="300" height="115" rx="8" fill="#eef3fa" stroke="#012169" stroke-width="3"/>
    <text x="225" y="111" font-size="34" font-weight="bold">Agent</text>
    <text x="225" y="150" font-size="23">Chooses an action</text>
    <rect x="725" y="65" width="300" height="115" rx="8" fill="#eef3fa" stroke="#012169" stroke-width="3"/>
    <text x="875" y="111" font-size="34" font-weight="bold">Environment</text>
    <text x="875" y="150" font-size="23">Responds to the action</text>
    <text x="550" y="96" font-size="29">Action</text>
    <path d="M 375 125 H 715" fill="none" stroke="#012169" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 875 180 V 250 H 225 V 190" fill="none" stroke="#012169" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="550" y="211" font-size="27">New observation + reward</text>
    <text x="550" y="284" font-size="22">The observation provides information about the state.</text>
  </g>
</svg>
